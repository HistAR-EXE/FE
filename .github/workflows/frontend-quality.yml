name: Frontend quality

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  lint-and-build-windows:
    name: Lint and production build (Windows)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Lint and build
        run: npm run ci

      - name: Source admin tests
        run: npm run test:admin

      - name: Heritage Studio contracts
        run: npm run test:heritage-studio

      - name: FE dependency security gate
        run: npm audit --audit-level=high

      - name: FE admin Playwright gate
        run: npm run test:e2e:admin

      - name: Heritage Studio mobile and privacy gate
        run: npx playwright test --project=heritage-studio
